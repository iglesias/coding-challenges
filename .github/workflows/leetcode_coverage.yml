name: leetcode_coverage
run-name: ${{ github.actor }} is measuring leetcode coverage

on: [push]

jobs:
  leetcode_coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install clang-20 llvm-20 libgtest-dev
          sudo ln -s /usr/lib/llvm-20/bin/llvm-cov /usr/bin/llvm-cov
          sudo ln -s /usr/lib/llvm-20/bin/llvm-profdata /usr/bin/llvm-profdata
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run:  |
          cd leetcode
          bash coverage.bash
